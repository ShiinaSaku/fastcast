ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - "@yuku-parser/binding-android-arm64@0.13.0"
  - "@yuku-parser/binding-darwin-arm64@0.13.0"
  - "@yuku-parser/binding-darwin-x64@0.13.0"
  - "@yuku-parser/binding-freebsd-x64@0.13.0"
  - "@yuku-parser/binding-linux-arm-gnu@0.13.0"
  - "@yuku-parser/binding-linux-arm-musl@0.13.0"
  - "@yuku-parser/binding-linux-arm64-gnu@0.13.0"
  - "@yuku-parser/binding-linux-arm64-musl@0.13.0"
  - "@yuku-parser/binding-linux-x64-gnu@0.13.0"
  - "@yuku-parser/binding-linux-x64-musl@0.13.0"
  - "@yuku-parser/binding-win32-arm64@0.13.0"
  - "@yuku-parser/binding-win32-x64@0.13.0"
  - "@yuku-toolchain/types@0.13.0"
  - yuku-parser@0.13.0

trustPolicy: no-downgrade
trustPolicyExclude:
  - why-is-node-running@3.2.2

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - "!vendor/*"

overrides:
  array-includes: "npm:@nolyfill/array-includes@latest"
  array.prototype.findlastindex: "npm:@nolyfill/array.prototype.findlastindex@latest"
  array.prototype.flat: "npm:@nolyfill/array.prototype.flat@latest"
  array.prototype.flatmap: "npm:@nolyfill/array.prototype.flatmap@latest"
  hasown: "npm:@nolyfill/hasown@latest"
  object.fromentries: "npm:@nolyfill/object.fromentries@latest"
  object.groupby: "npm:@nolyfill/object.groupby@latest"
  object.values: "npm:@nolyfill/object.values@latest"

  source-map: "npm:source-map-js@latest"

allowBuilds:
  esbuild: true
  simple-git-hooks: true
